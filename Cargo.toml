[package]
name = "sniproxy"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["console", "jemalloc"]
jemalloc = ["tikv-jemallocator"]
console = ["console-subscriber", "opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry", "opentelemetry-semantic-conventions", "tracing-subscriber/registry"]

[dependencies]
tokio = { version = "1.45.1", features = ["rt-multi-thread", "net", "macros", "sync", "signal", "parking_lot", "tracing"] }
tls-parser = { version = "0.12.2", features = ["serialize"] }
fast-socks5 = "0.10.0"
hickory-resolver = { version = "0.25.2", default-features = false, features = ["tokio"] }
clap = { version = "4.5.40", features = ["derive"] }
url = "2.5.4"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["parking_lot"] }
# only h1 for http needed as h2 would always be over tls
hyper = { version = "1.6.0", features = ["server", "http1", "client"], default-features = false }
hyper-util = { version = "0.1.14", features = ["client-legacy", "http1", "tokio"] }
tower = { version = "0.5.2", features = ["util"] }
anyhow = "1.0.98"
prometheus = "0.14.0"
once_cell = { version = "1.21.3", features = ["parking_lot"] }
pin-project = "1"
http-body = "1.0.1"
http-body-util = "0.1.3"
happy-eyeballs = { version = "0.2.1", features = ["tokio"] }
rand = "0.9.1"

console-subscriber = { version = "0.2.0", features = ["parking_lot"], optional = true }
# wait for this pr to upgrade to 0.22: https://github.com/tokio-rs/tracing-opentelemetry/pull/100
opentelemetry = { version = "0.21.0", optional = true }
opentelemetry_sdk = { version = "0.21.0", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.14.0", features = ["trace"], optional = true }
tracing-opentelemetry = { version = "0.22.0", optional = true }
opentelemetry-semantic-conventions = { version = "0.14.0", optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-splice = "0.2.1"